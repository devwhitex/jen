services:
  - type: web
    name: discord-maintainer-bot
    runtime: node
    plan: free
    buildCommand: npm install --no-package-lock
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DASHBOARD_PASSCODE
        value: admin123
      - key: EMBED_COLOR
        value: "#5865F2"
      - key: DEFAULT_PREFIX
        value: "!"
      - key: NODE_VERSION
        value: 22
